<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Seat goat</title>

<style>

body{
margin:0;
background:#e9e9e9;
font-family:sans-serif;
display:flex;
height:100vh;
align-items:center;
justify-content:center;
}

#layout{
display:flex;
gap:40px;
align-items:center;
}

#seatArea{
width:1600px;
height:1000px;
background:white;
border:3px solid black;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
position:relative;
overflow:hidden;
}

#panel{
width:220px;
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

#panel button{
width:100%;
margin-top:10px;
padding:8px;
}

#panel input{
width:100%;
margin-top:6px;
margin-bottom:6px;
padding:7px;
}

.circle{
position:absolute;
width:70px;
height:70px;
border:3px solid black;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
font-weight:bold;
background:white;
cursor:pointer;
transition: all 0.2s ease;
}

/* 카운트다운 오버레이 스타일 */
#countdownOverlay {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0, 0, 0, 0.4);
display: none;
align-items: center;
justify-content: center;
font-size: 120px;
font-weight: bold;
color: white;
z-index: 10;
user-select: none;
}

/* 9.png 효과 이미지 스타일 */
#effectImage {
position: absolute;
top: 0;
left: 0;
width: 100%;
height: 100%;
object-fit: cover;
z-index: 20;
opacity: 0;
pointer-events: none;
transition: opacity 0.8s ease-out;
}

/* 페이드아웃 실행 클래스 */
#effectImage.show {
opacity: 1;
}

</style>
</head>

<body>

<div id="layout">

<div id="seatArea">
  <div id="countdownOverlay">3</div>
  <img id="effectImage" src="9.png" alt="효과 이미지">
</div>

<div id="panel">

<div>맞춤 설정</div>
<input id="numbers" placeholder="예: 1-5,8,11-13">

<button onclick="undo()">되돌리기</button>
<button id="shuffleBtn" onclick="startCountdown()">☠️</button>
<button onclick="resetAll()">초기화</button>

</div>

</div>

<script>

let area=document.getElementById("seatArea")
let overlay=document.getElementById("countdownOverlay")
let shuffleBtn=document.getElementById("shuffleBtn")
let effectImg=document.getElementById("effectImage")
let circles=[]
let createNumber=1
const circleSize=70
let isShuffling=false

area.addEventListener("click",function(e){

if(e.target.classList.contains("circle")) return

let rect=area.getBoundingClientRect()

let x=e.clientX-rect.left
let y=e.clientY-rect.top

x=Math.max(circleSize/2,Math.min(rect.width-circleSize/2,x))
y=Math.max(circleSize/2,Math.min(rect.height-circleSize/2,y))

let circle=document.createElement("div")

circle.className="circle"
circle.innerText=createNumber

circle.style.left=(x-circleSize/2)+"px"
circle.style.top=(y-circleSize/2)+"px"

circle.addEventListener("click",function(event){
event.stopPropagation()
})

area.appendChild(circle)

circles.push(circle)

createNumber++

})

function undo(){

let last=circles.pop()

if(last){
last.remove()
createNumber--
}

}

function parseNumbers(input){

let result=[]
let parts=input.split(",")

parts.forEach(p=>{

p=p.trim()

if(p.includes("-")){

let [a,b]=p.split("-").map(Number)

for(let i=a;i<=b;i++){
result.push(i)
}

}else{

let n=parseInt(p)
if(!isNaN(n)) result.push(n)

}

})

return result

}

// 3초 카운트다운 및 이미지 애니메이션 함수
function startCountdown(){

if(isShuffling || circles.length === 0) return

isShuffling = true
shuffleBtn.disabled = true

let count = 3
overlay.style.display = "flex"
overlay.innerText = count

let timer = setInterval(() => {
    count--
    if(count > 0){
        overlay.innerText = count
    } else {
        clearInterval(timer)
        overlay.style.display = "none"
        
        // 자리 섞기
        shuffleNumbers()

        // 9.png 이미지 등장 및 페이드아웃 효과 실행
        effectImg.classList.add("show")

        setTimeout(() => {
            effectImg.classList.remove("show")
            isShuffling = false
            shuffleBtn.disabled = false
        }, 800) // 0.8초 동안 보여진 후 서서히 사라짐
    }
}, 1000)

}

// 피셔-예이츠 셔플 함수
function shuffleNumbers(){

let text=document.getElementById("numbers").value

let numbers=parseNumbers(text)

for(let i = numbers.length - 1; i > 0; i--){
    let j = Math.floor(Math.random() * (i + 1));
    [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
}

circles.forEach((c,i)=>{

if(numbers[i]!==undefined){
c.innerText=numbers[i]
}else{
c.innerText=""
}

})

}

function resetAll(){

circles.forEach(c=>c.remove())

circles=[]
createNumber=1

}

</script>

</body>
</html>
